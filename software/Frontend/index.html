<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fénix Telemetría</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d; color: #f0f0f0;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 24px; min-height: 100vh;
    }
    #header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #ff3c00; padding-bottom: 12px; margin-bottom: 24px;
    }
    #title { font-size: 26px; font-weight: bold; letter-spacing: 2px; color: #ff3c00; }
    #status-bar { font-size: 13px; color: #aaa; }
    #ws-indicator { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #aaa; }
    #ws-dot { width: 10px; height: 10px; border-radius: 50%; background: #e74c3c; transition: background 0.3s; }
    #ws-dot.connected { background: #27ae60; }

    .chart-section {
      background: #1a1a1a; border-radius: 10px;
      padding: 16px; margin-bottom: 24px;
    }
    .chart-title {
      font-size: 13px; font-weight: bold; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 12px;
    }
    .chart-container { position: relative; height: 220px; width: 100%; }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px; margin-bottom: 24px;
    }
    .card { background: #1a1a1a; border-radius: 10px; padding: 16px; }
    .card-title {
      font-size: 13px; font-weight: bold; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 12px;
    }
    .field-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 6px 0; border-bottom: 1px solid #2a2a2a;
    }
    .field-row:last-child { border-bottom: none; }
    .field-label { font-size: 13px; color: #aaa; }
    .field-value { font-size: 18px; font-weight: bold; color: #f0f0f0; }
    .field-unit  { font-size: 11px; color: #666; margin-left: 4px; }

    #cells-section {
      background: #1a1a1a; border-radius: 10px; padding: 16px;
      border-left: 4px solid #f39c12; margin-bottom: 24px;
    }
    #cells-title {
      font-size: 13px; font-weight: bold; text-transform: uppercase;
      letter-spacing: 1px; color: #f39c12; margin-bottom: 16px;
    }
    #cells-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px;
    }
    .cell-card { background: #222; border-radius: 6px; padding: 8px 10px; text-align: center; }
    .cell-name  { font-size: 10px; color: #666; margin-bottom: 4px; }
    .cell-value { font-size: 16px; font-weight: bold; }
    .cell-ok    { color: #f0f0f0; }
    .cell-warn  { color: #e74c3c; }
  </style>
</head>
<body>

  <div id="header">
    <div id="title">ESCUDERÍA FÉNIX — TELEMETRÍA</div>
    <div style="display:flex; gap:24px; align-items:center;">
      <div id="ws-indicator">
        <div id="ws-dot"></div>
        <span id="ws-label">Desconectado</span>
      </div>
      <div id="status-bar">Sin datos</div>
    </div>
  </div>

  <!-- Gráfica RPM + Throttle + Brake -->
  <div class="chart-section" style="border-left: 4px solid #e74c3c;">
    <div class="chart-title" style="color:#e74c3c;">📈 RPM / Throttle / Brake — 15 s</div>
    <div class="chart-container"><canvas id="chart-control"></canvas></div>
  </div>

  <!-- Gráfica Corriente -->
  <div class="chart-section" style="border-left: 4px solid #3498db;">
    <div class="chart-title" style="color:#3498db;">⚡ Corriente Paquete — 15 s</div>
    <div class="chart-container"><canvas id="chart-curr"></canvas></div>
  </div>

  <!-- Gráfica SOC -->
  <div class="chart-section" style="border-left: 4px solid #27ae60;">
    <div class="chart-title" style="color:#27ae60;">🔋 Estado de Carga (SOC) — 15 s</div>
    <div class="chart-container"><canvas id="chart-soc"></canvas></div>
  </div>

  <!-- Variables numéricas -->
  <div id="grid"></div>

  <!-- Celdas -->
  <div id="cells-section" style="display:none;">
    <div id="cells-title">🔋 VOLTAJE DE CELDAS</div>
    <div id="cells-grid"></div>
  </div>

<script>
const CATEGORIES = [
  { title: "🏎️ Velocidad & Motor", color: "#e74c3c", fields: [
      { key: "speed_v",  label: "Velocidad",        unit: "km/h" },
      { key: "rpm",      label: "RPM",               unit: "rpm"  },
      { key: "mot_torq", label: "Torque Motor",      unit: "Nm"   },
      { key: "curr_rms", label: "Corriente RMS",     unit: "A"    },
  ]},
  { title: "🔋 Batería HV", color: "#27ae60", fields: [
      { key: "soc",       label: "Estado de Carga",   unit: "%"  },
      { key: "volt_p",    label: "Voltaje Paquete",   unit: "V"  },
      { key: "curr_p",    label: "Corriente Paquete", unit: "A"  },
      { key: "batt_curr", label: "Corriente Batería", unit: "A"  },
      { key: "tmp_max",   label: "Temp. Max Celda",   unit: "°C" },
      { key: "tmp_min",   label: "Temp. Min Celda",   unit: "°C" },
  ]},
  { title: "🌡️ Temperaturas", color: "#e67e22", fields: [
      { key: "tmp_mot",  label: "Motor",       unit: "°C" },
      { key: "tmp_cont", label: "Controlador", unit: "°C" },
      { key: "tmp_cap",  label: "Capacitores", unit: "°C" },
  ]},
  { title: "⚡ Auxiliar", color: "#8e44ad", fields: [
      { key: "volt_a",  label: "Voltaje Aux",        unit: "V" },
      { key: "curr_a",  label: "Corriente Aux",      unit: "A" },
      { key: "ksy_v",   label: "Voltaje KSY",        unit: "V" },
      { key: "cont_st", label: "Estado Controlador", unit: ""  },
  ]},
  { title: "🕹️ Controles", color: "#2980b9", fields: [
      { key: "throttle", label: "Acelerador",  unit: "%" },
      { key: "brake",    label: "Freno Regen", unit: "%" },
      { key: "odo_veh",  label: "Odómetro",    unit: "m" },
  ]},
  { title: "📍 GPS", color: "#16a085", fields: [
      { key: "gps_lat", label: "Latitud",  unit: "°" },
      { key: "gps_lon", label: "Longitud", unit: "°" },
  ]},
  { title: "📐 IMU – Acelerómetro", color: "#d35400", fields: [
      { key: "acc_x", label: "Acc X", unit: "g" },
      { key: "acc_y", label: "Acc Y", unit: "g" },
      { key: "acc_z", label: "Acc Z", unit: "g" },
  ]},
  { title: "🔄 IMU – Giroscopio", color: "#c0392b", fields: [
      { key: "gyro_x", label: "Gyro X", unit: "°/s" },
      { key: "gyro_y", label: "Gyro Y", unit: "°/s" },
      { key: "gyro_z", label: "Gyro Z", unit: "°/s" },
  ]},
];

// ── Tarjetas ──────────────────────────────────────────────────────────────────
const grid = document.getElementById("grid");
CATEGORIES.forEach(cat => {
  const card = document.createElement("div");
  card.className = "card";
  card.style.borderLeft = `4px solid ${cat.color}`;
  const titleEl = document.createElement("div");
  titleEl.className = "card-title";
  titleEl.style.color = cat.color;
  titleEl.textContent = cat.title;
  card.appendChild(titleEl);
  cat.fields.forEach(f => {
    const row = document.createElement("div");
    row.className = "field-row";
    const label = document.createElement("span");
    label.className = "field-label";
    label.textContent = f.label;
    const valWrap = document.createElement("span");
    const valEl = document.createElement("span");
    valEl.className = "field-value";
    valEl.id = `val-${f.key}`;
    valEl.textContent = "—";
    const unitEl = document.createElement("span");
    unitEl.className = "field-unit";
    unitEl.textContent = f.unit;
    valWrap.appendChild(valEl);
    valWrap.appendChild(unitEl);
    row.appendChild(label);
    row.appendChild(valWrap);
    card.appendChild(row);
  });
  grid.appendChild(card);
});

// ── Gráficas ──────────────────────────────────────────────────────────────────
const WINDOW_MS = 15000;

const X_OPTS = {
  type: "time",
  time: { unit: "second", displayFormats: { second: "HH:mm:ss" } },
  ticks: { color: "#aaa", maxTicksLimit: 15 },
  grid:  { color: "#222" },
};

// Gráfica RPM + Throttle + Brake (dos ejes Y)
const ctxControl = document.getElementById("chart-control").getContext("2d");
const chartControl = new Chart(ctxControl, {
  type: "line",
  data: { datasets: [
    { label: "RPM",      data: [], borderColor: "#e74c3c", backgroundColor: "rgba(231,76,60,0.06)",   borderWidth: 2, pointRadius: 0, fill: true,  tension: 0, yAxisID: "yRpm"      },
    { label: "Throttle", data: [], borderColor: "#27ae60", backgroundColor: "rgba(39,174,96,0.0)",    borderWidth: 2, pointRadius: 0, fill: false, tension: 0, yAxisID: "yPercent"  },
    { label: "Brake",    data: [], borderColor: "#e67e22", backgroundColor: "rgba(230,126,34,0.0)",   borderWidth: 2, pointRadius: 0, fill: false, tension: 0, yAxisID: "yPercent"  },
  ]},
  options: {
    animation: false, responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: true, labels: { color: "#aaa", boxWidth: 12 } } },
    scales: {
      x: X_OPTS,
      yRpm:     { position: "left",  title: { display: true, text: "RPM", color: "#e74c3c" }, ticks: { color: "#e74c3c" }, grid: { color: "#222" }, min: 0, max: 5000 },
      yPercent: { position: "right", title: { display: true, text: "%",   color: "#aaa"    }, ticks: { color: "#aaa"    }, grid: { drawOnChartArea: false }, min: 0, max: 100 },
    }
  }
});

// Gráfica Corriente
const ctxCurr = document.getElementById("chart-curr").getContext("2d");
const chartCurr = new Chart(ctxCurr, {
  type: "line",
  data: { datasets: [{ label: "Corriente", data: [], borderColor: "#3498db", backgroundColor: "rgba(52,152,219,0.08)", borderWidth: 2, pointRadius: 0, fill: true, tension: 0 }]},
  options: {
    animation: false, responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { x: X_OPTS, y: { title: { display: true, text: "A", color: "#aaa" }, ticks: { color: "#aaa" }, grid: { color: "#222" }, min: -150, max: 150 } }
  }
});

// Gráfica SOC
const ctxSoc = document.getElementById("chart-soc").getContext("2d");
const chartSoc = new Chart(ctxSoc, {
  type: "line",
  data: { datasets: [{ label: "SOC", data: [], borderColor: "#27ae60", backgroundColor: "rgba(39,174,96,0.08)", borderWidth: 2, pointRadius: 0, fill: true, tension: 0 }]},
  options: {
    animation: false, responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { x: X_OPTS, y: { title: { display: true, text: "%", color: "#aaa" }, ticks: { color: "#aaa" }, grid: { color: "#222" }, min: 0, max: 100 } }
  }
});

function pushDataset(chart, datasetIndex, timestamp, value) {
  const now = new Date(timestamp.replace(" ", "T")).getTime() || Date.now();
  const ds  = chart.data.datasets[datasetIndex];
  ds.data.push({ x: now, y: value });
  const cutoff = now - WINDOW_MS;
  while (ds.data.length > 0 && ds.data[0].x < cutoff) ds.data.shift();
}

function updateCharts(timestamp, data) {
  pushDataset(chartControl, 0, timestamp, data.rpm      || 0);
  pushDataset(chartControl, 1, timestamp, data.throttle || 0);
  pushDataset(chartControl, 2, timestamp, data.brake    || 0);
  chartControl.update("none");

  pushDataset(chartCurr, 0, timestamp, data.curr_p || 0);
  chartCurr.update("none");

  pushDataset(chartSoc, 0, timestamp, data.soc || 0);
  chartSoc.update("none");
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
const WS_URL = "ws://23.94.237.163:8050/ws";
let ws = null;

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    document.getElementById("ws-dot").classList.add("connected");
    document.getElementById("ws-label").textContent = "Conectado";
  };
  ws.onmessage = (event) => {
    const payload = JSON.parse(event.data);
    updateDashboard(payload);
  };
  ws.onclose = () => {
    document.getElementById("ws-dot").classList.remove("connected");
    document.getElementById("ws-label").textContent = "Reconectando...";
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
}

function updateDashboard(payload) {
  const data = payload.data || {};

  document.getElementById("status-bar").textContent =
    `Vehículo ${payload.vehicle_id}  •  Sesión ${payload.session_id}  •  Último: ${payload.timestamp}`;

  // Valores numéricos
  CATEGORIES.forEach(cat => {
    cat.fields.forEach(f => {
      const el = document.getElementById(`val-${f.key}`);
      if (!el) return;
      const val = data[f.key];
      el.textContent = (val !== undefined && val !== null)
        ? (typeof val === "number" ? val.toFixed(2) : val) : "—";
    });
  });

  // Gráficas
  updateCharts(payload.timestamp, data);

  // Celdas
  const cells = data.cells || {};
  const cellKeys = Object.keys(cells).sort();
  if (cellKeys.length > 0) {
    document.getElementById("cells-section").style.display = "block";
    const cellGrid = document.getElementById("cells-grid");
    cellKeys.forEach(key => {
      const val = cells[key];
      let card = document.getElementById(`cell-${key}`);
      if (!card) {
        card = document.createElement("div");
        card.className = "cell-card";
        card.id = `cell-${key}`;
        const nameEl = document.createElement("div");
        nameEl.className = "cell-name";
        nameEl.textContent = key.replace("_", " ").toUpperCase();
        const valEl = document.createElement("div");
        valEl.className = "cell-value";
        valEl.id = `cellval-${key}`;
        card.appendChild(nameEl);
        card.appendChild(valEl);
        cellGrid.appendChild(card);
      }
      const valEl = document.getElementById(`cellval-${key}`);
      valEl.textContent = `${val.toFixed(3)} V`;
      valEl.className = "cell-value " + ((val < 3.0 || val > 4.2) ? "cell-warn" : "cell-ok");
    });
  }
}

connect();
</script>
</body>
</html>
